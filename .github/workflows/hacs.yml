name: HACS Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Called by Release, so that a version is published only once these checks pass.
  workflow_call:

permissions:
  contents: read

# github.workflow is "Release" when called from Release: the group then stays distinct from this
# workflow's own push run on main, so neither cancels the other. The event too: the checks the screenshot commit
# dispatches on a pull request's branch have their own group, so a dispatched run stuck on GitHub's side (queued
# with no job, impossible to cancel) cannot hold the pull request's own runs, nor theirs.
concurrency:
  group: hacs-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The built file lives in the releases, not in the repository: HACS can only validate the repository once a
      # release exists. Before the first one (which the Release workflow publishes once this check passes), the
      # validation is skipped instead of failing, so that a new repository is not locked out of its first release.
      - name: Check for a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq length)
          echo "exists=$([ "$count" != "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$count" != "0" ] || echo "::notice::No release yet: HACS validation skipped until the first one is published."

      - name: HACS validation
        if: steps.release.outputs.exists == 'true'
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: plugin
